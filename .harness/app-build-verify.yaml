pipeline:
  id: SpringBoot Build and Verify
  name: SpringBoot Build and Verify
  identifier: default
  projectIdentifier: default_project
  orgIdentifier: default
  
  clone:
    enabled: true
    connector: connector_Github_6538
    repo: Orion-user1/app-build-verify
    ref:
      type: branch
      name: ${{ inputs.branch }}
  
  stages:
    - stage:
        name: Build and Verify
        identifier: BuildAndVerify
        type: CI
        spec:
          cloneCodebase: true
          runtime:
            type: Cloud
            spec: {}

          execution:
            steps:
              - step:
                  type: Run
                  name: Lint
                  identifier: lint
                  spec:
                    shell: Bash
                    command: |
                      echo "🔍 Running code quality checks..."
                      python3 devops-automation/scripts/lint.py

              - step:
                  type: Run
                  name: Secret Scan
                  identifier: secret_scan
                  spec:
                    shell: Bash
                    command: |
                      echo "🔒 Scanning for exposed secrets..."
                      python3 devops-automation/scripts/secret_scan.py

              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: dependencies
                  spec:
                    shell: Bash
                    command: |
                      echo "📦 Resolving dependencies from JFrog Artifactory..."
                      mvn dependency:resolve -B

              - step:
                  type: Run
                  name: Build
                  identifier: build
                  spec:
                    shell: Bash
                    command: |
                      echo "🔨 Building application..."
                      mvn clean package -DskipTests -B
                      echo "✅ Build complete:"
                      ls -lh target/*.jar

                      echo ""
                      echo "💾 Saving JAR for publish pipeline..."

                      # Create shared output directory
                      mkdir -p /harness/outputs

                      # Copy JAR to shared location
                      cp target/*.jar /harness/outputs/demo.jar

                      # Save build metadata for next pipeline
                      cat > /harness/outputs/build-info.json <<EOF
                      {
                        "jarFile": "demo.jar",
                        "jarPath": "/harness/outputs/demo.jar",
                        "buildId": "<+pipeline.sequenceId>",
                        "pipelineId": "<+pipeline.executionId>",
                        "commitSha": "<+trigger.commitSha>",
                        "branch": "<+trigger.branch>",
                        "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      }
                      EOF

                      echo "✅ JAR saved at: /harness/outputs/demo.jar"
                      echo "📋 Metadata: /harness/outputs/build-info.json"

              - step:
                  type: Run
                  name: Unit Tests
                  identifier: tests
                  spec:
                    shell: Bash
                    command: |
                      echo "🧪 Running unit tests with coverage..."
                      mvn test -B

              - step:
                  type: Run
                  name: Coverity SAST
                  identifier: coverity
                  spec:
                    shell: Bash
                    command: |
                      echo "🛡️ Running Coverity SAST scan..."
                      python3 devops-automation/scripts/coverity.py

              - step:
                  type: Run
                  name: Black Duck SCA
                  identifier: blackduck
                  when:
                    stageStatus: Success
                    condition: <+pipeline.variables.triggerType> == "pull_request"
                  spec:
                    shell: Bash
                    command: |
                      echo "🔍 Running Black Duck SCA scan..."
                      echo "Scanning libraries for vulnerabilities and licenses..."
                      python3 devops-automation/scripts/blackduck.py
                      echo "✅ Results uploaded to Black Duck SRM"

################################################################################
#                           END OF PIPELINE                                    #
################################################################################
