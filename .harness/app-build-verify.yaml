################################################################################
#  Pipeline:  cicd-app-build-verify
#  Purpose:   Automated CI/CD for Spring Boot applications
#  Runtime:   Harness Cloud
#  Note:      Triggers are separate Harness entities - see
#             app-build-verify-triggers.yaml
################################################################################

pipeline:
  name: SpringBoot Build and Verify
  identifier: cicd_app_build_verify
  # Must be literal values (expressions are not allowed here).
  # Replace with your real IDs, or use "default" for the default org.
  projectIdentifier: YOUR_PROJECT_ID
  orgIdentifier: default

  properties:
    ci:
      codebase:
        connectorRef: account.github_app_connector
        repoName: cicd-app-build-and-verify
        build: <+input>

  stages:
    - stage:
        name: Build and Verify
        identifier: BuildAndVerify
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:

              # Clone shared DevOps scripts (additionalRepositories is not a
              # valid pipeline property; a Git Clone step is used instead)
              - step:
                  type: GitClone
                  name: Clone DevOps Automation
                  identifier: clone_devops_automation
                  spec:
                    connectorRef: account.github_devops_connector
                    repoName: DevOps/devops-automation
                    cloneDirectory: devops-automation
                    build:
                      type: branch
                      spec:
                        branch: main

              # STEP 1/7: Code Quality Check
              - step:
                  type: Run
                  name: Lint
                  identifier: lint
                  spec:
                    shell: Bash
                    command: |
                      echo "Running code quality checks..."
                      python3 devops-automation/scripts/lint.py

              # STEP 2/7: Secret Detection
              - step:
                  type: Run
                  name: Secret Scan
                  identifier: secret_scan
                  spec:
                    shell: Bash
                    command: |
                      echo "Scanning for exposed secrets..."
                      python3 devops-automation/scripts/secret_scan.py

              # STEP 3/7: Dependency Resolution
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: dependencies
                  spec:
                    shell: Bash
                    command: |
                      echo "Resolving dependencies from JFrog Artifactory..."
                      mvn dependency:resolve -B

              # STEP 4/7: Application Build
              - step:
                  type: Run
                  name: Build
                  identifier: build
                  spec:
                    shell: Bash
                    command: |
                      echo "Building application..."
                      mvn clean package -DskipTests -B
                      echo "Build complete:"
                      ls -lh target/*.jar

                      echo "Saving JAR for publish pipeline..."
                      mkdir -p /harness/outputs
                      cp target/*.jar /harness/outputs/demo.jar

                      cat > /harness/outputs/build-info.json <<EOF
                      {
                        "jarFile": "demo.jar",
                        "jarPath": "/harness/outputs/demo.jar",
                        "buildId": "<+pipeline.sequenceId>",
                        "pipelineId": "<+pipeline.executionId>",
                        "commitSha": "<+codebase.commitSha>",
                        "branch": "<+codebase.branch>",
                        "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      }
                      EOF

                      echo "JAR saved at: /harness/outputs/demo.jar"
                      echo "Metadata: /harness/outputs/build-info.json"

              # STEP 5/7: Unit Testing
              - step:
                  type: Run
                  name: Unit Tests
                  identifier: tests
                  spec:
                    shell: Bash
                    command: |
                      echo "Running unit tests with coverage..."
                      mvn test -B

              # STEP 6/7: Security Scan (SAST)
              - step:
                  type: Run
                  name: Coverity SAST
                  identifier: coverity
                  spec:
                    shell: Bash
                    command: |
                      echo "Running Coverity SAST scan..."
                      python3 devops-automation/scripts/coverity.py

              # STEP 7/7: Component Scan (SCA) - pull requests and merges to main only
              - step:
                  type: Run
                  name: Black Duck SCA
                  identifier: blackduck
                  when:
                    stageStatus: Success
                    condition: <+trigger.event> == "PR" || <+codebase.branch> == "main"
                  spec:
                    shell: Bash
                    command: |
                      echo "Running Black Duck SCA scan..."
                      python3 devops-automation/scripts/blackduck.py
                      echo "Results uploaded to Black Duck SRM"
