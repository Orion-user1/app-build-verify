pipeline:
  id: java_app_ci
  name: Java App CI
  description: CI pipeline for a Java Maven app with lint, secrets scan, dependency install, build, unit tests, SAST and SCA.
  tags:
    ai_generated: ""
  inputs:
    branch:
      type: string
      required: true
      description: Branch to check out
  clone:
    enabled: true
    connector: connector_Github_6538
    repo: Orion-user1/Test-app-repo
    ref:
      type: branch
      name: ${{ inputs.branch }}
  stages:
    - id: ci
      name: CI
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: lint
          name: Lint
          run:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B checkstyle:check
        - id: secrets_scan
          name: Secrets Scan
          template:
            uses: gitleaksStep
        - id: install_dependencies
          name: Install Dependencies
          run:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B dependency:resolve
        - id: build_application
          name: Build Application
          run:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B package -DskipTests
        - id: unit_tests
          name: Unit Tests
          run-test:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: mvn -B test
        - id: sast
          name: SAST
          template:
            uses: semgrepStep
        - id: sca
          name: SCA
          template:
            uses: osvStep
